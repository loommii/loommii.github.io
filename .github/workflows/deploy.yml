name: Deploy Hugo Site

# 手动按钮触发：从私有仓库拉取源码，Hugo 构建后全量强制覆盖发布到 gh-pages 分支
# 发布方式：孤儿提交 + force push（每次发布只有一个提交，不再累积历史、不需要清理旧文件）
on:
  workflow_dispatch:

permissions:
  contents: write

# force push 不会因并发而报错（后到的直接覆盖），必须在此串行化，否则可能出现旧内容覆盖新内容
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # ── 1. 检出部署仓库（actions-gh-pages 需要已初始化的 git 工作区）──
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      # ── 2. 检出私有源码仓库（blog-fixit）──
      - name: Checkout private source repo
        uses: actions/checkout@v4
        with:
          repository: loommii/blog
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: blog-fixit-source
          # 必须全量克隆：浅克隆下 git log 会把“边界提交”的时间返回给所有文件，
          # 导致未写 lastmod 的文章被标成“更新于本次 push”，并污染 sitemap 的 lastmod
          fetch-depth: 0

      # ── 3. 安装 Hugo ──
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true

      # ── 4. Hugo 构建 ──
      - name: Build with Hugo
        working-directory: blog-fixit-source
        run: hugo --minify

      # ── 5. 产物校验：强制覆盖前确认产物非空，避免把线上覆盖成空站 ──
      - name: Verify build output
        working-directory: blog-fixit-source
        run: |
          test -s public/index.html || { echo "❌ 构建产物为空，已中止发布"; exit 1; }
          echo "✅ 产物 HTML 数量: $(find public -name '*.html' | wc -l)"

      # ── 6. 全量强制覆盖发布到 gh-pages（孤儿提交，历史只保留 1 条）──
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./blog-fixit-source/public
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: rebuild site (run ${{ github.run_id }})'
